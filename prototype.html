<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doctor Slot Utilization Tracker — Prototype</title>
<style>
:root {
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --acc:#2a78d6; --acc-soft:#cde2fb;
  --net:#1baf7a;
  --track:#f0efec;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --acc:#3987e5; --acc-soft:#104281;
    --net:#199e70;
    --track:#2c2c2a;
  }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink-1);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px; }
.wrap { max-width:1220px; margin:0 auto; padding:20px 24px 60px; }
header h1 { font-size:21px; margin:0 0 2px; }
header .sub { color:var(--ink-3); font-size:12px; }
header .sub a { color:var(--acc); text-decoration:none; }
.badge { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--acc); border:1px solid var(--acc);
  border-radius:5px; padding:1px 7px; vertical-align:2px; margin-left:8px; }
.controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:18px 0 6px;
  border-bottom:1px solid var(--axis); }
.tabs { display:flex; gap:2px; }
.tabs button { font:inherit; font-size:13.5px; font-weight:600; border:0; background:transparent;
  color:var(--ink-3); padding:9px 14px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
.tabs button.on { color:var(--ink-1); border-bottom-color:var(--acc); }
.toggle { margin-left:auto; display:flex; gap:4px; background:var(--track); padding:3px;
  border-radius:8px; margin-bottom:6px; }
.toggle button { font:inherit; font-size:12px; border:0; background:transparent; color:var(--ink-2);
  padding:5px 12px; border-radius:6px; cursor:pointer; }
.toggle button.on { background:var(--surface-1); color:var(--ink-1); font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.12); }
.exec { background:var(--surface-1); border:1px solid var(--border); border-left:3px solid var(--acc);
  border-radius:10px; padding:12px 16px; margin:16px 0; font-size:13px; color:var(--ink-2); line-height:1.55; }
.exec b { color:var(--ink-1); }
.band { margin:22px 0 8px; display:flex; align-items:baseline; gap:10px; }
.band h2 { font-size:12px; margin:0; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); }
.band .line { flex:1; height:1px; background:var(--grid); }
.band .tag { font-size:11px; color:var(--ink-3); }
.matrixcard { background:var(--surface-1); border:1px solid var(--border); border-radius:10px;
  padding:6px 14px 12px; overflow-x:auto; }
table.matrix { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:13px; }
.matrix th { font-size:10px; color:var(--ink-3); font-weight:600; text-transform:uppercase;
  letter-spacing:.03em; border-bottom:1px solid var(--axis); padding:9px 10px; text-align:right; white-space:nowrap; }
.matrix th.dim { text-align:left; }
.matrix td { padding:8px 10px; text-align:right; border-bottom:1px solid var(--grid); white-space:nowrap; }
.matrix td.dim { text-align:left; font-weight:650; color:var(--ink-1); vertical-align:middle; }
.matrix td.dim.grp { border-right:1px solid var(--grid); background:var(--page); }
.matrix td.dim .sub { display:block; font-size:10.5px; font-weight:500; color:var(--ink-3); }
.matrix td .big { font-weight:700; font-size:14px; }
.matrix td.mut { color:var(--ink-2); }
.matrix tr.subtotal td { background:var(--page); font-weight:650; border-top:1px solid var(--axis); }
.matrix tr.subtotal td.dim { color:var(--ink-2); font-size:12px; }
.utilcell { display:inline-flex; align-items:center; gap:8px; justify-content:flex-end; min-width:110px; }
.ubar { width:52px; height:6px; background:var(--track); border-radius:3px; overflow:hidden; flex:none; }
.ubar i { display:block; height:100%; border-radius:3px; }
.cfgpill { font-size:10.5px; color:var(--ink-3); background:var(--track); border-radius:5px; padding:2px 7px; }
.cfgcard { background:var(--surface-1); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px; margin-top:14px; }
.cfgcard h3 { font-size:12px; margin:0 0 8px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); }
.cfgrow { display:flex; flex-wrap:wrap; gap:8px; }
.cfgchip { border:1px solid var(--border); background:var(--page); border-radius:7px;
  padding:6px 11px; font-size:12px; color:var(--ink-2); }
.cfgchip b { color:var(--ink-1); }
.note { font-size:11.5px; color:var(--ink-3); margin-top:10px; line-height:1.5; }
footer { color:var(--ink-3); font-size:11px; margin-top:22px; line-height:1.5; }
.muted { color:var(--ink-3); }
td.tipanchor { position:relative; }
.tipbox { display:none; position:absolute; right:0; top:calc(100% + 4px); z-index:20;
  background:var(--surface-1); border:1px solid var(--border); border-radius:9px;
  box-shadow:0 6px 20px rgba(0,0,0,.22); padding:10px 12px; text-align:left; }
tr.hasTip:hover .tipbox { display:block; }
tr.hasTip td b.tt { border-bottom:1px dashed var(--axis); cursor:help; }
.tipbox h4 { margin:0 0 6px; font-size:11px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; }
.tipbox table { border-collapse:collapse; font-size:12px; margin:0; }
.tipbox th, .tipbox td { padding:3px 10px; border-bottom:1px solid var(--grid); white-space:nowrap; }
.tipbox th { font-size:10px; color:var(--ink-3); text-transform:uppercase; }
.tipbox td:first-child, .tipbox th:first-child { text-align:left; color:var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Doctor Slot Utilization Tracker <span class="badge">Prototype</span></h1>
    <div class="sub" id="who"></div>
    <div class="sub">Single-doctor prototype — <b>Company level ≡ Doctor level</b> by construction ·
      <a href="index.html">main tracker</a> · <a href="weekly.html">weekly deep-dive</a></div>
  </header>

  <div class="controls">
    <div class="tabs" id="tabs">
      <button data-t="1" class="on">1 · Overall — SC vs RPT</button>
      <button data-t="2">2 · Online / Offline Split</button>
      <button data-t="3">3 · Program Split</button>
    </div>
    <div class="toggle" id="metricToggle">
      <button data-m="slot" class="on">Slot Level</button>
      <button data-m="hour">Hour Level</button>
    </div>
  </div>

  <div class="exec" id="exec"></div>
  <div id="content"></div>

  <footer id="foot"></footer>
</div>

<script src="data_prototype.js"></script>
<script>
(function(){
  const D = window.PROTO_DATA;
  if (!D){ document.body.innerHTML = '<p style="padding:40px">No data — run fetch_prototype_data.py</p>'; return; }
  const fmtDay = new Date(D.day+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
  document.getElementById('who').textContent = `${D.doctor} · ${fmtDay} · refreshed ${D.updated}`;

  // ---------- configs ----------
  const cfg = {};
  D.configs.forEach(c=>{ cfg[`${c.type}|${c.program}`] = c.mins; });
  const UNIT = { SC: cfg['SC|sexual_health'] ?? cfg['SC|any'] ?? 10,
                 RPT: cfg['FU|any'] ?? 5 };
  const PMIN = {
    'SC|sexual_health': cfg['SC|sexual_health'] ?? UNIT.SC,
    'SC|mental_health': cfg['SC|mental_health'] ?? UNIT.SC,
    'SC|unattributed':  cfg['SC|sexual_health'] ?? UNIT.SC,
    'RPT|sexual_health': cfg['FU|any'] ?? UNIT.RPT,
    'RPT|mental_health': cfg['FU|mental_health'] ?? UNIT.RPT,
    'RPT|unattributed':  cfg['FU|any'] ?? UNIT.RPT,
  };
  const pmin = (t,p) => PMIN[`${t}|${p}`] ?? UNIT[t];

  // ---------- aggregation ----------
  // No Show per business definition: booking touched AFTER the slot start
  // (updated_at > start_time) and not completed — this catches late reschedules
  // and late cancellations, which burned the slot exactly like a miss.
  function classify(a){
    if (a.status==='COMPLETED') return 'comp';
    if (a.status==='MISSED' || a.uas===1) return 'ns';
    if (a.status==='RESCHEDULED') return 'resch';
    if (a.status==='CANCELLED') return 'canc';
    return null;
  }
  function offered(typ, channel){
    // channel is 3-way in the data: Offline-only / Online-only / Both (dual block).
    // Dual-block capacity is bookable either way, so it counts as offered in BOTH
    // channel sections; with no channel filter each window counts once.
    let u=0, m=0;
    D.slots.forEach(s=>{
      if (s.typ!==typ) return;
      if (channel && !(s.channel===channel || s.channel==='Both')) return;
      u+=s.slots; m+=s.slots*s.dur;
    });
    return {u, m};
  }
  function outcomes(typ, channel, program){
    const o = {comp:0,ns:0,resch:0,canc:0, compM:0,nsM:0,reschM:0,cancM:0};
    D.appts.forEach(a=>{
      if (a.typ!==typ) return;
      if (channel && a.channel!==channel) return;
      if (program && a.program!==program) return;
      const k = classify(a); if (!k) return;
      o[k]+=a.n; o[k+'M']+=a.n*pmin(a.typ, a.program);
    });
    o.booked = o.comp+o.ns+o.resch+o.canc;
    o.bookedM = o.compM+o.nsM+o.reschM+o.cancM;
    return o;
  }

  // ---------- rendering ----------
  let tab='1', metric='slot';
  const isHour = () => metric==='hour';
  const fmtN = v => isHour() ? (v/60).toFixed(1)+'h' : String(v);
  const fp = v => v==null?'–':(v*100).toFixed(1)+'%';
  const pctv = (n,d) => d>0 ? n/d : null;

  // a matrix row: dims = array of {label, sub?, span?} or null (covered by rowspan above)
  function matrix(dimHeaders, rows){
    const head = `<tr>${dimHeaders.map(h=>`<th class="dim">${h}</th>`).join('')}
      <th>Offered</th><th>Total Booked</th><th>Completed</th><th>No Show</th>
      <th>Rescheduled</th><th>Cancelled</th><th>Gross Util</th><th>Net Util</th><th>Config</th></tr>`;
    const bar = (v,color)=>`<span class="utilcell"><span class="ubar"><i style="width:${Math.min(100,(v||0)*100)}%;background:${color}"></i></span>${fp(v)}</span>`;
    const body = rows.map(r=>{
      const offV = isHour() ? r.off.m : r.off.u;
      const val = k => isHour() ? r.o[k+'M'] : r.o[k];
      const dims = r.dims.map(d=>{
        if (d===null) return '';
        const span = d.span ? ` rowspan="${d.span}"` : '';
        const grp = d.span && d.span>1 ? ' grp' : '';
        return `<td class="dim${grp}"${span}>${d.label}${d.sub?`<span class="sub">${d.sub}</span>`:''}</td>`;
      }).join('');
      return `<tr class="${r.cls||''}${r.tip?' hasTip':''}">${dims}
        <td><span class="big">${fmtN(offV)}</span>${r.shared?' <span class="muted">*</span>':''}</td>
        <td class="${r.tip?'tipanchor':''}"><b class="${r.tip?'tt':''}">${fmtN(val('booked'))}</b>${r.tip||''}</td>
        <td class="mut">${fmtN(val('comp'))}</td>
        <td class="mut">${fmtN(val('ns'))}</td>
        <td class="mut">${fmtN(val('resch'))}</td>
        <td class="mut">${fmtN(val('canc'))}</td>
        <td>${bar(pctv(val('comp')+val('ns'), offV),'var(--acc)')}</td>
        <td>${bar(pctv(val('comp'), offV),'var(--net)')}</td>
        <td><span class="cfgpill">${r.cfg} min</span></td>
      </tr>`;
    }).join('');
    return `<div class="matrixcard"><table class="matrix"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  }

  const band = (label, tag) => `<div class="band"><h2>${label}</h2><div class="line"></div><span class="tag">${tag||''}</span></div>`;
  const twoLevels = html =>
    band('Company / Overall level', 'all doctors — 1 in this prototype') + html +
    band(`Doctor level — ${D.doctor}`, 'identical to company level by construction') + html;
  const cfgCard = (chips, extra) => `<div class="cfgcard"><h3>Slot configuration</h3>
      <div class="cfgrow">${chips.map(([l,v])=>`<div class="cfgchip">${l} · <b>${v} min</b></div>`).join('')}</div>
      ${extra?`<div class="note">${extra}</div>`:''}</div>`;

  const PROGRAMS = [['sexual_health','Sexual Health'],['mental_health','Mental Health'],['unattributed','Unattributed']];
  const CHANNELS = ['Offline','Online'];
  const TYPE_SUB = { SC:'Screening Calls', RPT:'FU · RR · PQ' };

  function renderTab1(){
    const rows = ['SC','RPT'].map(t=>({
      dims:[{label:t, sub:TYPE_SUB[t]}], off:offered(t), o:outcomes(t), cfg:UNIT[t]
    }));
    document.getElementById('content').innerHTML =
      twoLevels(matrix(['Type'], rows)) +
      cfgCard([['SC slot unit',UNIT.SC],['RPT slot unit',UNIT.RPT],
               ['SC · Mental Health booking',PMIN['SC|mental_health']],['FU · Mental Health booking',PMIN['RPT|mental_health']]],
        'The roster grid is cut in the base unit sizes; a Mental Health booking spans multiple consecutive units, which is why hour-level utilization can differ from slot-level.');
    const sc = outcomes('SC'), so = offered('SC'), rp = outcomes('RPT'), ro = offered('RPT');
    document.getElementById('exec').innerHTML =
      `<b>${fmtDay.split(',')[0]}:</b> SC ran at <b>${fp(pctv(isHour()?sc.compM+sc.nsM:sc.comp+sc.ns, isHour()?so.m:so.u))} gross</b> / ${fp(pctv(isHour()?sc.compM:sc.comp, isHour()?so.m:so.u))} net on ${fmtN(isHour()?so.m:so.u)} ${isHour()?'offered':'slots'}; ` +
      `RPT at <b>${fp(pctv(isHour()?rp.compM+rp.nsM:rp.comp+rp.ns, isHour()?ro.m:ro.u))} gross</b> / ${fp(pctv(isHour()?rp.compM:rp.comp, isHour()?ro.m:ro.u))} net on ${fmtN(isHour()?ro.m:ro.u)}. ` +
      `Reschedules (${sc.resch+rp.resch}) are the largest leak between gross and net.`;
  }

  function renderTab2(){
    const rows = [];
    ['SC','RPT'].forEach(t=>{
      CHANNELS.forEach((ch,i)=>{
        rows.push({
          dims:[ i===0 ? {label:t, sub:TYPE_SUB[t], span:CHANNELS.length} : null, {label:ch} ],
          off:offered(t,ch), o:outcomes(t,ch), cfg:UNIT[t]
        });
      });
    });
    document.getElementById('content').innerHTML =
      twoLevels(matrix(['Type','Channel'], rows)) +
      cfgCard([['SC slot unit (both channels)',UNIT.SC],['RPT slot unit (both channels)',UNIT.RPT],
               ['SC · Mental Health booking',PMIN['SC|mental_health']],['FU · Mental Health booking',PMIN['RPT|mental_health']]],
        'Slot configuration does not vary by channel. A booking’s channel is the appointment’s mode; slot capacity’s channel comes from the roster block’s ' +
        'location mappings — a dual offline+online block is bookable either way, so its slots count as offered in BOTH channel rows (which is why ' +
        'Offline + Online offered can exceed the type total in Tab 1).');
    const so=offered('SC','Offline'), sn=offered('SC','Online');
    document.getElementById('exec').innerHTML =
      `<b>Channel mix:</b> SC capacity splits ${fmtN(isHour()?so.m:so.u)} offline vs ${fmtN(isHour()?sn.m:sn.u)} online. ` +
      `Each row reads independently — booked, outcomes and utilization for that type × channel only.`;
  }

  function combine(a,b){
    const o = {}; for (const k in a) o[k] = a[k] + b[k]; return o;
  }
  function shTip(t, ch, off){
    const sh = outcomes(t,ch,'sexual_health'), un = outcomes(t,ch,'unattributed');
    const offV = isHour() ? off.m : off.u;
    const cell = (o,k) => fmtN(isHour() ? o[k+'M'] : o[k]);
    const util = (o,ks) => fp(pctv(ks.reduce((s,k)=>s+(isHour()?o[k+'M']:o[k]),0), offV));
    const rowT = (label, key) => `<tr><td>${label}</td><td>${cell(sh,key)}</td><td>${cell(un,key)}</td></tr>`;
    return `<div class="tipbox"><h4>Sexual Health — tag split</h4><table>
      <tr><th></th><th>Tagged SH</th><th>Unattributed</th></tr>
      ${rowT('Total booked','booked')}${rowT('Completed','comp')}${rowT('No show','ns')}
      ${rowT('Rescheduled','resch')}${rowT('Cancelled','canc')}
      <tr><td>Gross util</td><td>${util(sh,['comp','ns'])}</td><td>${util(un,['comp','ns'])}</td></tr>
      <tr><td>Net util</td><td>${util(sh,['comp'])}</td><td>${util(un,['comp'])}</td></tr>
    </table></div>`;
  }
  function renderTab3(){
    const P3 = [['sh','Sexual Health'],['mental_health','Mental Health']];
    const rows = [];
    ['SC','RPT'].forEach(t=>{
      CHANNELS.forEach((ch,ci)=>{
        const pool = offered(t,ch);
        P3.forEach(([p,pn],pi)=>{
          const cfgP = p==='sh' ? pmin(t,'sexual_health') : pmin(t,p);
          // shared pool expressed in THIS program's slot size:
          // 300 shared minutes = 30 SH slots (10m) but only 10 MH slots (30m)
          const progOff = { u: Math.round(pool.m / cfgP * 10)/10, m: pool.m };
          const o = p==='sh'
            ? combine(outcomes(t,ch,'sexual_health'), outcomes(t,ch,'unattributed'))
            : outcomes(t,ch,p);
          rows.push({
            dims:[
              (ci===0 && pi===0) ? {label:t, sub:TYPE_SUB[t], span:CHANNELS.length*(P3.length+1)} : null,
              pi===0 ? {label:ch, span:P3.length+1} : null,
              {label:pn}
            ],
            off:progOff, o, cfg:cfgP, shared:true,
            tip: p==='sh' ? shTip(t,ch,progOff) : null
          });
        });
        rows.push({
          dims:[null, null, {label:'All programs'}],
          off:offered(t,ch), o:outcomes(t,ch), cfg:UNIT[t], cls:'subtotal'
        });
      });
    });
    document.getElementById('content').innerHTML =
      twoLevels(matrix(['Type','Channel','Program'], rows)) +
      cfgCard([['SC · Sexual Health',PMIN['SC|sexual_health']],['SC · Mental Health',PMIN['SC|mental_health']],
               ['RPT · Sexual Health',PMIN['RPT|sexual_health']],['RPT (FU) · Mental Health',PMIN['RPT|mental_health']]],
        '* The roster is ONE shared pool of minutes per type × channel — capacity carries no program tag. Each program row shows that pool ' +
        'expressed in <b>its own slot size</b>: e.g. 300 shared SC minutes = 30 Sexual-Health slots (10 min) but only 10 Mental-Health slots (30 min). ' +
        'Utilization on a program row = that program’s bookings ÷ what the pool could hold at its slot size — equivalently, its share of pool time. ' +
        'The “All programs” subtotal row counts the pool in base units. Sexual Health includes untagged bookings (their slot length matches the SH config); ' +
        '<b>hover the Sexual Health “Total Booked” value</b> to see the tagged-vs-unattributed split with full outcomes and utilization.');
    const mh = outcomes('SC',null,'mental_health');
    const shc = combine(outcomes('SC',null,'sexual_health'), outcomes('SC',null,'unattributed'));
    document.getElementById('exec').innerHTML =
      `<b>Program lens:</b> SC bookings split ${fmtN(isHour()?shc.bookedM:shc.booked)} Sexual Health vs ${fmtN(isHour()?mh.bookedM:mh.booked)} Mental Health. ` +
      `Sexual Health includes untagged bookings — hover its Total Booked value for the tagged-vs-unattributed split. ` +
      `Switch to Hour Level to see the true time cost (an MH screening is ${PMIN['SC|mental_health']}m vs ${PMIN['SC|sexual_health']}m).`;
  }

  function render(){
    ({'1':renderTab1,'2':renderTab2,'3':renderTab3})[tab]();
    document.getElementById('foot').innerHTML =
      `Definitions — <b>Offered</b>: total configured slots on the roster (after shrinkage). <b>Total Booked</b> = Completed + No Show + Rescheduled + Cancelled. ` +
      `<b>No Show</b> = booking updated after the slot start without completing (includes late reschedules/cancellations — the slot was burned). ` +
      `<b>Gross Utilization</b> = (Completed + No Show) ÷ Offered. <b>Net Utilization</b> = Completed ÷ Offered. ` +
      `Rescheduled and cancelled here mean released BEFORE the slot start (slot returned to the pool). ` +
      `Hour Level converts each metric via its program’s configured duration. ` +
      `Data: allo_prod roster_slots (corrected dedup) + appointments + consultation_type_configs · ${D.doctor} · ${D.day}. ` +
      `Refresh: <code>python3 fetch_prototype_data.py [provider_id] [day]</code>.`;
  }

  document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{
    tab = b.dataset.t;
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on', x===b));
    render();
  }));
  document.querySelectorAll('#metricToggle button').forEach(b=>b.addEventListener('click',()=>{
    metric = b.dataset.m;
    document.querySelectorAll('#metricToggle button').forEach(x=>x.classList.toggle('on', x===b));
    render();
  }));
  render();
})();
</script>
</body>
</html>
