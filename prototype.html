<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doctor Slot Utilization Tracker — Prototype</title>
<style>
:root {
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --acc:#2a78d6; --acc-soft:#cde2fb;
  --net:#1baf7a;
  --track:#f0efec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --acc:#3987e5; --acc-soft:#104281;
    --net:#199e70;
    --track:#2c2c2a;
  }
}
:root[data-theme="dark"] {
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --acc:#3987e5; --acc-soft:#104281;
    --net:#199e70;
    --track:#2c2c2a;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink-1);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px; }
.wrap { max-width:1220px; margin:0 auto; padding:20px 24px 60px; }
header h1 { font-size:21px; margin:0 0 2px; }
header .sub { color:var(--ink-3); font-size:12px; }
header .sub a { color:var(--acc); text-decoration:none; }
.badge { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--acc); border:1px solid var(--acc);
  border-radius:5px; padding:1px 7px; vertical-align:2px; margin-left:8px; }
.controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:18px 0 6px;
  border-bottom:1px solid var(--axis); }
.tabs { display:flex; gap:2px; }
.tabs button { font:inherit; font-size:13.5px; font-weight:600; border:0; background:transparent;
  color:var(--ink-3); padding:9px 14px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
.tabs button.on { color:var(--ink-1); border-bottom-color:var(--acc); }
.toggle { margin-left:auto; display:flex; gap:4px; background:var(--track); padding:3px;
  border-radius:8px; margin-bottom:6px; }
.toggle button { font:inherit; font-size:12px; border:0; background:transparent; color:var(--ink-2);
  padding:5px 12px; border-radius:6px; cursor:pointer; }
.toggle button.on { background:var(--surface-1); color:var(--ink-1); font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.12); }
.statcards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:14px 0 4px; }
.statcard { background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:14px 18px; }
.statcard .l { font-size:12px; color:var(--ink-2); }
.statcard .v { font-size:28px; font-weight:700; margin-top:2px; }
.exec { background:var(--surface-1); border:1px solid var(--border); border-left:3px solid var(--acc);
  border-radius:10px; padding:12px 16px; margin:16px 0; font-size:13px; color:var(--ink-2); line-height:1.55; }
.exec b { color:var(--ink-1); }
.band { margin:22px 0 8px; display:flex; align-items:baseline; gap:10px; }
.band h2 { font-size:12px; margin:0; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); }
.band .line { flex:1; height:1px; background:var(--grid); }
.band .tag { font-size:11px; color:var(--ink-3); }
.matrixcard { background:var(--surface-1); border:1px solid var(--border); border-radius:10px;
  padding:6px 14px 12px; overflow-x:auto; }
table.matrix { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:13px; }
.matrix th { font-size:10px; color:var(--ink-3); font-weight:600; text-transform:uppercase;
  letter-spacing:.03em; border-bottom:1px solid var(--axis); padding:9px 10px; text-align:right; white-space:nowrap; }
.matrix th.dim { text-align:left; }
.matrix td { padding:8px 10px; text-align:right; border-bottom:1px solid var(--grid); white-space:nowrap; }
.matrix td.dim { text-align:left; font-weight:650; color:var(--ink-1); vertical-align:middle; }
.matrix td.dim.grp { border-right:1px solid var(--grid); background:var(--page); }
.matrix td.dim .sub { display:block; font-size:10.5px; font-weight:500; color:var(--ink-3); }
.matrix td .big { font-weight:700; font-size:14px; }
.matrix td.mut { color:var(--ink-2); }
table.matrix.compact th, table.matrix.compact td { padding:5px 3px; font-size:11px; }
table.matrix.compact .cfgpill { padding:1px 4px; font-size:9.5px; }
.matrix tr.subtotal td { background:var(--page); font-weight:650; border-top:1px solid var(--axis); }
.matrix tr.subtotal td.dim { color:var(--ink-2); font-size:12px; }
.utilcell { display:inline-flex; align-items:center; gap:8px; justify-content:flex-end; min-width:110px; }
.ubar { width:52px; height:6px; background:var(--track); border-radius:3px; overflow:hidden; flex:none; }
.ubar i { display:block; height:100%; border-radius:3px; }
.cfgpill { font-size:10.5px; color:var(--ink-3); background:var(--track); border-radius:5px; padding:2px 7px; }
.cfgcard { background:var(--surface-1); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px; margin-top:14px; }
.cfgcard h3 { font-size:12px; margin:0 0 8px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); }
.cfgrow { display:flex; flex-wrap:wrap; gap:8px; }
.cfgchip { border:1px solid var(--border); background:var(--page); border-radius:7px;
  padding:6px 11px; font-size:12px; color:var(--ink-2); }
.cfgchip b { color:var(--ink-1); }
.note { font-size:11.5px; color:var(--ink-3); margin-top:10px; line-height:1.5; }
footer { color:var(--ink-3); font-size:11px; margin-top:22px; line-height:1.5; }
.muted { color:var(--ink-3); }
td.tipanchor { position:relative; }
.tipbox { display:none; position:absolute; right:0; top:calc(100% + 4px); z-index:20;
  background:var(--surface-1); border:1px solid var(--border); border-radius:9px;
  box-shadow:0 6px 20px rgba(0,0,0,.22); padding:10px 12px; text-align:left; }
tr.hasTip:hover .tipbox { display:block; }
tr.hasTip td b.tt { border-bottom:1px dashed var(--axis); cursor:help; }
.tipbox h4 { margin:0 0 6px; font-size:11px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; }
.tipbox table { border-collapse:collapse; font-size:12px; margin:0; }
.tipbox th, .tipbox td { padding:3px 10px; border-bottom:1px solid var(--grid); white-space:nowrap; }
.tipbox th { font-size:10px; color:var(--ink-3); text-transform:uppercase; }
.tipbox td:first-child, .tipbox th:first-child { text-align:left; color:var(--ink-2); }
/* --- utilization table: grouped headers + aligned numeric columns --- */
table.util { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums lining-nums; font-size:13px; }
table.util th, table.util td { white-space:nowrap; }
table.util thead th { font-weight:600; color:var(--ink-3); text-transform:uppercase; letter-spacing:.03em; }
table.util thead tr.grp th { font-size:10px; padding:9px 10px 5px; text-align:center; border-bottom:1px solid var(--grid); }
table.util thead tr.grp th.dimh { text-align:left; vertical-align:bottom; border-bottom:1px solid var(--axis); }
table.util thead tr.grp th .gsub { display:block; font-size:9px; font-weight:500; letter-spacing:0;
  text-transform:none; color:var(--ink-3); opacity:.8; }
table.util thead tr.sub th { font-size:9.5px; padding:4px 10px 7px; text-align:right;
  border-bottom:1px solid var(--axis); color:var(--ink-3); }
table.util tbody td { padding:7px 10px; text-align:right; border-bottom:1px solid var(--grid); }
table.util tbody td.lbl { text-align:left; font-weight:650; color:var(--ink-1); }
table.util tbody td.lbl .sub { display:block; font-size:10.5px; font-weight:500; color:var(--ink-3); margin-top:1px; }
table.util td.cfg { text-align:center; }
table.util .gs { border-left:1px solid var(--grid); }
table.util tbody td.mh, table.util thead th.mh { text-align:right; }
table.util .mhwrap { display:inline-flex; align-items:baseline; justify-content:flex-end; }
table.util .mhwrap .m { display:inline-block; min-width:44px; text-align:right; color:var(--ink-2); }
table.util .mhwrap .sep { display:inline-block; width:15px; text-align:center; color:var(--ink-3); opacity:.45; }
table.util .mhwrap .h { display:inline-block; min-width:46px; text-align:right; font-weight:650; color:var(--ink-1); }
table.util thead .mhwrap .m, table.util thead .mhwrap .h { color:var(--ink-3); font-weight:600; }
table.util tbody tr.tot .mhwrap .m { color:var(--ink-1); }
table.util tbody td.zz .mhwrap .m, table.util tbody td.zz .mhwrap .h { opacity:.5; }
table.util.compact .mhwrap .m { min-width:38px; }
table.util.compact .mhwrap .h { min-width:40px; }
table.util.compact .mhwrap .sep { width:12px; }
table.util tbody td.cnt { color:var(--ink-2); }
table.util tbody td.z { color:var(--ink-3); opacity:.55; }
table.util tbody tr.rptstart td { border-top:2px solid var(--axis); }
table.util tbody tr:hover td { background:var(--track); }
table.util tbody tr.tot td { background:var(--page); font-weight:700; color:var(--ink-1);
  border-top:2px solid var(--axis); border-bottom:0; padding-top:9px; padding-bottom:9px; }
table.util tbody tr.tot:hover td { background:var(--page); }
table.util tbody tr.na td { color:var(--ink-3); }
table.util.compact thead tr.grp th { padding:8px 6px 4px; }
table.util.compact thead tr.sub th { padding:3px 6px 6px; }
table.util.compact tbody td { padding:6px 6px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Doctor Slot Utilization Tracker <span class="badge">Prototype</span></h1>
    <div class="sub" id="who"></div>
    <div class="sub">Single-doctor prototype — <b>Company level ≡ Doctor level</b> by construction ·
      <a href="index.html">main tracker</a> · <a href="weekly.html">weekly deep-dive</a></div>
  </header>

  <div class="controls">
    <div class="tabs" id="tabs">
      <button data-t="0" class="on">1 · Total Utilization</button>
      <button data-t="1">2 · Overall — SC vs RPT</button>
      <button data-t="2">3 · Online / Offline Split</button>
      <button data-t="3">4 · Program Split</button>
      <button data-t="u">5 · Utilization</button>
    </div>
    <div class="toggle" id="metricToggle">
      <button data-m="slot" class="on">Slot Level</button>
      <button data-m="hour">Hour Level</button>
    </div>
    <div class="toggle" id="themeToggle" style="margin-left:0">
      <button data-th="auto">Auto</button>
      <button data-th="light">☀ Light</button>
      <button data-th="dark">☾ Dark</button>
    </div>
  </div>

  <div class="exec" id="exec"></div>
  <div id="content"></div>

  <footer id="foot"></footer>
</div>

<script src="data_prototype.js"></script>
<script src="data_utilz.js"></script>
<script>
(function(){
  const KEY='proto-theme';
  const btns = document.querySelectorAll('#themeToggle button');
  function applyTheme(t){
    if (t==='auto') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    btns.forEach(b=>b.classList.toggle('on', b.dataset.th===t));
    try{ localStorage.setItem(KEY,t); }catch(e){}
  }
  btns.forEach(b=>b.addEventListener('click',()=>applyTheme(b.dataset.th)));
  let saved='auto'; try{ saved=localStorage.getItem(KEY)||'auto'; }catch(e){}
  applyTheme(saved);
})();
(function(){
  const D = window.PROTO_DATA;
  if (!D){ document.body.innerHTML = '<p style="padding:40px">No data — run fetch_prototype_data.py</p>'; return; }
  const fmtDay = new Date(D.day+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
  document.getElementById('who').textContent = `${D.doctor} · ${fmtDay} · refreshed ${D.updated}`;

  // ---------- configs ----------
  const cfg = {};
  D.configs.forEach(c=>{ cfg[`${c.type}|${c.program}`] = c.mins; });
  const UNIT = { SC: cfg['SC|sexual_health'] ?? cfg['SC|any'] ?? 10,
                 RPT: cfg['FU|any'] ?? 5 };
  const PMIN = {
    'SC|sexual_health': cfg['SC|sexual_health'] ?? UNIT.SC,
    'SC|mental_health': cfg['SC|mental_health'] ?? UNIT.SC,
    'SC|unattributed':  cfg['SC|sexual_health'] ?? UNIT.SC,
    'RPT|sexual_health': cfg['FU|any'] ?? UNIT.RPT,
    'RPT|mental_health': cfg['FU|mental_health'] ?? UNIT.RPT,
    'RPT|unattributed':  cfg['FU|any'] ?? UNIT.RPT,
  };
  const pmin = (t,p) => PMIN[`${t}|${p}`] ?? UNIT[t];

  // ---------- aggregation ----------
  // No Show per business definition: booking touched AFTER the slot start
  // (updated_at > start_time) and not completed — this catches late reschedules
  // and late cancellations, which burned the slot exactly like a miss.
  function classify(a){
    if (a.status==='COMPLETED') return 'comp';
    if (a.status==='MISSED' || a.uas===1) return 'ns';
    if (a.status==='RESCHEDULED') return 'resch';
    if (a.status==='CANCELLED') return 'canc';
    return null;
  }
  function offered(typ, channel){
    // channel is 3-way in the data: Offline-only / Online-only / Both (dual block).
    // Dual-block capacity is bookable either way, so it counts as offered in BOTH
    // channel sections; with no channel filter each window counts once.
    // w/wm = the subset inside live online-preferred windows (offline booking
    // for those slots closed at the configured cutoff before the window).
    let u=0, m=0, w=0, wm=0, du=0;
    D.slots.forEach(s=>{
      if (s.typ!==typ) return;
      if (channel && !(s.channel===channel || s.channel==='Both')) return;
      u+=s.slots; m+=s.slots*s.dur;
      if (s.in_win===1){ w+=s.slots; wm+=s.slots*s.dur; }
      if (s.channel==='Both'){ du+=s.slots; }
    });
    return {u, m, w, wm, du};
  }
  function outcomes(typ, channel, program){
    const o = {comp:0,ns:0,resch:0,canc:0, compM:0,nsM:0,reschM:0,cancM:0};
    D.appts.forEach(a=>{
      if (typ && a.typ!==typ) return;
      if (channel && a.channel!==channel) return;
      if (program && a.program!==program) return;
      const k = classify(a); if (!k) return;
      o[k]+=a.n; o[k+'M']+=a.n*pmin(a.typ, a.program);
    });
    o.booked = o.comp+o.ns+o.resch+o.canc;
    o.bookedM = o.compM+o.nsM+o.reschM+o.cancM;
    return o;
  }

  // ---------- rendering ----------
  let tab='0', metric='slot';
  const isHour = () => metric==='hour';
  const fmtN = v => isHour() ? (v/60).toFixed(1)+'h' : String(v);
  const fp = v => v==null?'–':(v*100).toFixed(1)+'%';
  const pctv = (n,d) => d>0 ? n/d : null;

  // a matrix row: dims = array of {label, sub?, span?} or null (covered by rowspan above)
  function matrix(dimHeaders, rows){
    const head = `<tr>${dimHeaders.map(h=>`<th class="dim">${h}</th>`).join('')}
      <th>Offered</th><th>Total Booked</th><th>Completed</th><th>No Show</th>
      <th>Rescheduled</th><th>Cancelled</th><th>Gross Util</th><th>Net Util</th><th>Config</th></tr>`;
    const bar = (v,color)=>`<span class="utilcell"><span class="ubar"><i style="width:${Math.min(100,(v||0)*100)}%;background:${color}"></i></span>${fp(v)}</span>`;
    const body = rows.map(r=>{
      const offV = isHour() ? r.off.m : r.off.u;
      const val = k => isHour() ? r.o[k+'M'] : r.o[k];
      const dims = r.dims.map(d=>{
        if (d===null) return '';
        const span = d.span ? ` rowspan="${d.span}"` : '';
        const grp = d.span && d.span>1 ? ' grp' : '';
        return `<td class="dim${grp}"${span}>${d.label}${d.sub?`<span class="sub">${d.sub}</span>`:''}</td>`;
      }).join('');
      if (offV===0 && val('booked')===0){
        // this doctor's blocks don't offer this type on this channel at all
        return `<tr class="${r.cls||''}">${dims}
          <td class="mut" colspan="8" style="text-align:left;color:var(--ink-3)">Not offered — no roster blocks map this type to this channel</td>
          <td><span class="cfgpill">${r.cfg} min</span></td>
        </tr>`;
      }
      return `<tr class="${r.cls||''}${r.tip?' hasTip':''}">${dims}
        <td><span class="big">${fmtN(offV)}</span>${r.shared?' <span class="muted">*</span>':''}${r.offNote?`<span style="display:block;font-size:10.5px;color:var(--ink-3);font-weight:400">${r.offNote}</span>`:''}</td>
        <td class="${r.tip?'tipanchor':''}"><b class="${r.tip?'tt':''}">${fmtN(val('booked'))}</b>${r.tip||''}</td>
        <td class="mut">${fmtN(val('comp'))}</td>
        <td class="mut">${fmtN(val('ns'))}</td>
        <td class="mut">${fmtN(val('resch'))}</td>
        <td class="mut">${fmtN(val('canc'))}</td>
        <td>${bar(pctv(val('comp')+val('ns'), offV),'var(--acc)')}</td>
        <td>${bar(pctv(val('comp'), offV),'var(--net)')}</td>
        <td><span class="cfgpill">${r.cfg} min</span></td>
      </tr>`;
    }).join('');
    return `<div class="matrixcard"><table class="matrix"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  }

  const band = (label, tag) => `<div class="band"><h2>${label}</h2><div class="line"></div><span class="tag">${tag||''}</span></div>`;
  const twoLevels = html =>
    band('Company / Overall level', 'all doctors — 1 in this prototype') + html +
    band(`Doctor level — ${D.doctor}`, 'identical to company level by construction') + html;
  function pscCard(){
    if (!D.psc || !D.psc.length) return '';
    const chips = D.psc.map(w=>{
      let cut = '';
      try {
        const c = JSON.parse(w.cutoffs || '[]')[0];
        if (c && c.locationType) cut = ` · ${c.locationType} booking opens ${c.cutoffMins/60}h before the window`;
        else if (c && c.slotCategory) cut = ` · reserved for ${c.slotCategory}`;
      } catch(e){}
      const kind = w.kind==='online' ? 'Online-preferred' : (w.kind==='repeat' ? 'Repeat-preferred' : w.kind);
      return `<div class="cfgchip">${kind} · <b>${w.start}–${w.end}</b>${cut}</div>`;
    }).join('');
    return `<div class="cfgcard"><h3>Preferred hours (this day)</h3><div class="cfgrow">${chips}</div>
      <div class="note">Online-preferred windows steer CHANNEL only: those slots are bookable online at ANY time, while offline
      booking for them opens only at the cutoff before the window (e.g. an 8h cutoff on a 12:00 window ⇒ offline can book it
      from 04:00 onward) — a near-time fallback so unsold online slots don't go to waste. They do not reserve capacity for any
      consult type. Repeat capacity is separate: booked repeat slots + whatever the roster's repeat boundary opens to repeats —
      dedicated repeat windows when configured, plus near-term freed slots (reschedules/cancellations) the system re-opens.</div></div>`;
  }
  const cfgCard = (chips, extra) => `<div class="cfgcard"><h3>Slot configuration</h3>
      <div class="cfgrow">${chips.map(([l,v])=>`<div class="cfgchip">${l} · <b>${v} min</b></div>`).join('')}</div>
      ${extra?`<div class="note">${extra}</div>`:''}</div>`;

  const PROGRAMS = [['sexual_health','Sexual Health'],['mental_health','Mental Health'],['unattributed','Unattributed']];
  const CHANNELS = ['Offline','Online'];
  const TYPE_SUB = { SC:'Screening Calls', RPT:'FU · RR · PQ' };

  function renderTab0(){
    const off = { u: offered('SC').u + offered('RPT').u, m: offered('SC').m + offered('RPT').m };
    const o = outcomes(null);
    const rows = [{
      dims:[{label:'Full day — all consults', sub:'SC + FU + RR + PQ, both channels'}],
      off, o, cfg:`${UNIT.SC} / ${UNIT.RPT}`
    }];
    document.getElementById('content').innerHTML =
      twoLevels(matrix(['Scope'], rows)) +
      cfgCard([['SC slot unit',UNIT.SC],['RPT slot unit',UNIT.RPT],
               ['SC · Mental Health booking',PMIN['SC|mental_health']],['FU · Mental Health booking',PMIN['RPT|mental_health']]],
        'Slot Level mixes 10-min SC units and 5-min repeat units in one count — Hour Level is the cleaner single number for the full-day picture.') +
      pscCard();
    const offV = isHour() ? off.m : off.u;
    const v = k => isHour() ? o[k+'M'] : o[k];
    document.getElementById('exec').innerHTML =
      `<b>${fmtDay.split(',')[0]} — the whole day in one line:</b> ${fmtN(offV)} ${isHour()?'':'slots '}offered, ` +
      `${fmtN(v('booked'))} booked, ${fmtN(v('comp'))} completed, ${fmtN(v('ns'))} no-shows, ` +
      `${fmtN(v('resch'))} rescheduled, ${fmtN(v('canc'))} cancelled → ` +
      `<b>${fp(pctv(v('comp')+v('ns'), offV))} gross</b> / <b>${fp(pctv(v('comp'), offV))} net</b> utilization.`;
  }

  function renderTab1(){
    const rows = ['SC','RPT'].map(t=>({
      dims:[{label:t, sub:TYPE_SUB[t]}], off:offered(t), o:outcomes(t), cfg:UNIT[t]
    }));
    document.getElementById('content').innerHTML =
      twoLevels(matrix(['Type'], rows)) +
      cfgCard([['SC slot unit',UNIT.SC],['RPT slot unit',UNIT.RPT],
               ['SC · Mental Health booking',PMIN['SC|mental_health']],['FU · Mental Health booking',PMIN['RPT|mental_health']]],
        'The roster grid is cut in the base unit sizes; a Mental Health booking spans multiple consecutive units, which is why hour-level utilization can differ from slot-level. ' +
        'SC offered excludes repeat/online-preferred windows (roster boundary flags); RPT offered = those windows + booked repeat slots.') +
      pscCard();
    const sc = outcomes('SC'), so = offered('SC'), rp = outcomes('RPT'), ro = offered('RPT');
    document.getElementById('exec').innerHTML =
      `<b>${fmtDay.split(',')[0]}:</b> SC ran at <b>${fp(pctv(isHour()?sc.compM+sc.nsM:sc.comp+sc.ns, isHour()?so.m:so.u))} gross</b> / ${fp(pctv(isHour()?sc.compM:sc.comp, isHour()?so.m:so.u))} net on ${fmtN(isHour()?so.m:so.u)} ${isHour()?'offered':'slots'}; ` +
      `RPT at <b>${fp(pctv(isHour()?rp.compM+rp.nsM:rp.comp+rp.ns, isHour()?ro.m:ro.u))} gross</b> / ${fp(pctv(isHour()?rp.compM:rp.comp, isHour()?ro.m:ro.u))} net on ${fmtN(isHour()?ro.m:ro.u)}. ` +
      `Reschedules (${sc.resch+rp.resch}) are the largest leak between gross and net.`;
  }

  function renderTab2(){
    const rows = [];
    ['SC','RPT'].forEach(t=>{
      CHANNELS.forEach((ch,i)=>{
        const off = offered(t,ch);
        const w = isHour() ? off.wm : off.w;
        rows.push({
          dims:[ i===0 ? {label:t, sub:TYPE_SUB[t], span:CHANNELS.length} : null, {label:ch} ],
          off, o:outcomes(t,ch), cfg:UNIT[t], shared: off.du>0,
          offNote: w>0 ? (ch==='Offline' ? `incl. ${fmtN(w)} offline only near window (cutoff)` : `incl. ${fmtN(w)} online-preferred`) : null
        });
      });
    });
    document.getElementById('content').innerHTML =
      twoLevels(matrix(['Type','Channel'], rows)) +
      cfgCard([['SC slot unit (both channels)',UNIT.SC],['RPT slot unit (both channels)',UNIT.RPT],
               ['SC · Mental Health booking',PMIN['SC|mental_health']],['FU · Mental Health booking',PMIN['RPT|mental_health']]],
        'Slot configuration does not vary by channel. A booking’s channel is the appointment’s mode; slot capacity’s channel comes from the roster block’s ' +
        'location mappings, PER TYPE — a block can offer SC offline-only while offering repeats offline+online. Types a doctor never maps to a channel ' +
        'show as “Not offered”. * = dual-mapped capacity: the SAME physical slots appear under both channel rows because they were bookable either way — never add Offline + Online offered together. ' +
        '“Offline only near window” = slots in an online-preferred window: online could book them anytime, offline only from the cutoff onward (e.g. last 8h).') +
      pscCard();
    const so=offered('SC','Offline'), sn=offered('SC','Online');
    document.getElementById('exec').innerHTML =
      `<b>Channel mix:</b> SC capacity splits ${fmtN(isHour()?so.m:so.u)} offline vs ${fmtN(isHour()?sn.m:sn.u)} online. ` +
      `Each row reads independently — booked, outcomes and utilization for that type × channel only.`;
  }

  function combine(a,b){
    const o = {}; for (const k in a) o[k] = a[k] + b[k]; return o;
  }
  function shTip(t, ch, off){
    const sh = outcomes(t,ch,'sexual_health'), un = outcomes(t,ch,'unattributed');
    const offV = isHour() ? off.m : off.u;
    const cell = (o,k) => fmtN(isHour() ? o[k+'M'] : o[k]);
    const util = (o,ks) => fp(pctv(ks.reduce((s,k)=>s+(isHour()?o[k+'M']:o[k]),0), offV));
    const rowT = (label, key) => `<tr><td>${label}</td><td>${cell(sh,key)}</td><td>${cell(un,key)}</td></tr>`;
    return `<div class="tipbox"><h4>Sexual Health — tag split</h4><table>
      <tr><th></th><th>Tagged SH</th><th>Unattributed</th></tr>
      ${rowT('Total booked','booked')}${rowT('Completed','comp')}${rowT('No show','ns')}
      ${rowT('Rescheduled','resch')}${rowT('Cancelled','canc')}
      <tr><td>Gross util</td><td>${util(sh,['comp','ns'])}</td><td>${util(un,['comp','ns'])}</td></tr>
      <tr><td>Net util</td><td>${util(sh,['comp'])}</td><td>${util(un,['comp'])}</td></tr>
    </table></div>`;
  }
  function renderTab3(){
    const P3 = [['sh','Sexual Health'],['mental_health','Mental Health']];
    const rows = [];
    ['SC','RPT'].forEach(t=>{
      CHANNELS.forEach((ch,ci)=>{
        const pool = offered(t,ch);
        P3.forEach(([p,pn],pi)=>{
          const cfgP = p==='sh' ? pmin(t,'sexual_health') : pmin(t,p);
          // shared pool expressed in THIS program's slot size:
          // 300 shared minutes = 30 SH slots (10m) but only 10 MH slots (30m)
          const progOff = { u: Math.round(pool.m / cfgP * 10)/10, m: pool.m };
          const o = p==='sh'
            ? combine(outcomes(t,ch,'sexual_health'), outcomes(t,ch,'unattributed'))
            : outcomes(t,ch,p);
          rows.push({
            dims:[
              (ci===0 && pi===0) ? {label:t, sub:TYPE_SUB[t], span:CHANNELS.length*(P3.length+1)} : null,
              pi===0 ? {label:ch, span:P3.length+1} : null,
              {label:pn}
            ],
            off:progOff, o, cfg:cfgP, shared:true,
            tip: p==='sh' ? shTip(t,ch,progOff) : null
          });
        });
        const offCh = offered(t,ch);
        const wCh = isHour() ? offCh.wm : offCh.w;
        rows.push({
          dims:[null, null, {label:'All programs'}],
          off:offCh, o:outcomes(t,ch), cfg:UNIT[t], cls:'subtotal',
          offNote: wCh>0 ? (ch==='Offline' ? `incl. ${fmtN(wCh)} offline only near window (cutoff)` : `incl. ${fmtN(wCh)} online-preferred`) : null
        });
      });
    });
    document.getElementById('content').innerHTML =
      twoLevels(matrix(['Type','Channel','Program'], rows)) +
      cfgCard([['SC · Sexual Health',PMIN['SC|sexual_health']],['SC · Mental Health',PMIN['SC|mental_health']],
               ['RPT · Sexual Health',PMIN['RPT|sexual_health']],['RPT (FU) · Mental Health',PMIN['RPT|mental_health']]],
        '* The roster is ONE shared pool of minutes per type × channel — capacity carries no program tag. Each program row shows that pool ' +
        'expressed in <b>its own slot size</b>: e.g. 300 shared SC minutes = 30 Sexual-Health slots (10 min) but only 10 Mental-Health slots (30 min). ' +
        'Utilization on a program row = that program’s bookings ÷ what the pool could hold at its slot size — equivalently, its share of pool time. ' +
        'The “All programs” subtotal row counts the pool in base units. Sexual Health includes untagged bookings (their slot length matches the SH config); ' +
        '<b>hover the Sexual Health “Total Booked” value</b> to see the tagged-vs-unattributed split with full outcomes and utilization.') +
      pscCard();
    const mh = outcomes('SC',null,'mental_health');
    const shc = combine(outcomes('SC',null,'sexual_health'), outcomes('SC',null,'unattributed'));
    document.getElementById('exec').innerHTML =
      `<b>Program lens:</b> SC bookings split ${fmtN(isHour()?shc.bookedM:shc.booked)} Sexual Health vs ${fmtN(isHour()?mh.bookedM:mh.booked)} Mental Health. ` +
      `Sexual Health includes untagged bookings — hover its Total Booked value for the tagged-vs-unattributed split. ` +
      `Switch to Hour Level to see the true time cost (an MH screening is ${PMIN['SC|mental_health']}m vs ${PMIN['SC|sexual_health']}m).`;
  }

  // ---------- Utilization tab (hours only, all doctors, date-filtered) ----------
  let uFrom=null, uTo=null, uShowCounts=false, uDoc='';
  const OUT_KEYS = {c:'comp', n:'ns', r:'resch', x:'canc'};
  const cfgCache = {};
  function cfgFor(U, d){
    if (cfgCache[d]) return cfgCache[d];
    const m = {};
    U.configs.forEach(r=>{ if(r[0]===d) m[`${r[1]}|${r[2]}`]=r[3]; });
    return cfgCache[d] = {
      'SC|SH': m['SC|sexual_health'] ?? m['SC|any'] ?? 10,
      'SC|MH': m['SC|mental_health'] ?? 30,
      'RPT|SH': m['FU|any'] ?? m['FU|sexual_health'] ?? 5,
      'RPT|MH': m['FU|mental_health'] ?? 10,
    };
  }
  function renderTabU(){
    const U = window.UTILZ_DATA;
    if (!U){ document.getElementById('content').innerHTML =
      '<div class="cfgcard">No data — run fetch_utilization_tab.py</div>'; document.getElementById('exec').innerHTML=''; return; }
    if (!uFrom){
      const today = new Date().toISOString().slice(0,10);
      const past = U.blocks.filter(b=>b[1]<today).map(b=>b[1]);  // latest COMPLETED day
      const last = past.length ? past.reduce((mx,d)=>d>mx?d:mx,'0')
                 : (U.blocks.length ? U.blocks[0][1] : U.updated.slice(0,10));
      uFrom = uTo = last;
    }
    const inR = dt => dt >= uFrom && dt <= uTo;
    const inDoc = d => uDoc==='' || d===+uDoc;
    const blockMins = U.blocks.filter(b=>inDoc(b[0]) && inR(b[1])).reduce((s,b)=>s+b[2],0);
    const blockH = blockMins/60;
    const activeDocs = [...new Set(U.blocks.filter(b=>inDoc(b[0]) && inR(b[1])).map(b=>b[0]))];
    const capable = (t,ch) => U.caps.some(c=>inDoc(c[0]) && inR(c[1]) && c[2]===t && (ch==='Offline'?c[3]===1:c[4]===1));
    const ROWS = [];
    ['SC','RPT'].forEach(t=>['Offline','Online'].forEach(ch=>['SH','MH'].forEach(pr=>ROWS.push([t,ch,pr]))));
    const fh = v => (Math.round(v*100)/100).toFixed(2);
    const fpu = v => v==null?'–':(v*100).toFixed(1)+'%';
    const mhCell = m => `<span class="mhwrap"><span class="m">${Math.round(m).toLocaleString('en-IN')}</span>`
      + `<span class="sep">|</span><span class="h">${fh(m/60)}</span></span>`;
    // totals: counts + minutes for booked / gross(comp+ns) / net(comp) / noshow(ns) / resch+canc
    const tot = {bookedC:0,bookedM:0, rcC:0, grossC:0,grossM:0, netC:0,netM:0, nsC:0,nsM:0};
    const trs = ROWS.map(([t,ch,pr])=>{
      const cfgSet = new Set(activeDocs.map(d=>cfgFor(U,d)[`${t}|${pr}`]));
      const cfgLabel = cfgSet.size===0 ? '–' : (cfgSet.size===1 ? [...cfgSet][0]+' min' : 'varies');
      const o={comp:0,ns:0,resch:0,canc:0}, om={comp:0,ns:0,resch:0,canc:0};
      U.appts.forEach(a=>{
        if (!inDoc(a[0]) || !inR(a[1]) || a[2]!==t || a[3]!==ch || a[4]!==pr) return;
        const k = OUT_KEYS[a[5]]; if(!k) return;
        o[k]+=a[6]; om[k]+=a[6]*cfgFor(U,a[0])[`${t}|${pr}`];
      });
      const bookedC = o.comp+o.ns+o.resch+o.canc, bookedM = om.comp+om.ns+om.resch+om.canc;
      const grossC = o.comp+o.ns, grossM = om.comp+om.ns;
      const rcC = o.resch+o.canc;
      tot.bookedC+=bookedC; tot.bookedM+=bookedM; tot.rcC+=rcC;
      tot.grossC+=grossC; tot.grossM+=grossM;
      tot.netC+=o.comp; tot.netM+=om.comp;
      tot.nsC+=o.ns; tot.nsM+=om.ns;
      const PG = uShowCounts ? 2 : 1;            // columns per metric group
      const isRptStart = (t==='RPT' && ch==='Offline' && pr==='SH') ? ' rptstart' : '';
      const nm = { SC:'SC', RPT:'Repeat' }[t];
      const pn = { SH:'Sexual Health', MH:'Mental Health' }[pr];
      if (bookedC===0 && !capable(t,ch)){
        return `<tr class="na${isRptStart}">
          <td class="lbl">${nm} · ${ch}<span class="sub">${pn}</span></td>
          <td class="cfg"><span class="cfgpill">${cfgLabel}</span></td>
          <td class="gs" colspan="${PG*4+1}" style="text-align:left">Not offered — no roster blocks map ${t} to ${ch.toLowerCase()} in this selection</td></tr>`;
      }
      const grp = (c,m,first) => (uShowCounts ? `<td class="cnt${first?' gs':''}${c===0?' z':''}">${c}</td>` : '')
        + `<td class="mh${(!uShowCounts&&first)?' gs':''}${m===0?' zz':''}">${mhCell(m)}</td>`;
      return `<tr class="${isRptStart}">
        <td class="lbl">${nm} · ${ch}<span class="sub">${pn}</span></td>
        <td class="cfg"><span class="cfgpill">${cfgLabel}</span></td>
        ${grp(bookedC, bookedM, true)}
        <td class="cnt gs${rcC===0?' z':''}">${rcC}</td>
        ${grp(grossC, grossM, true)}
        ${grp(o.comp, om.comp, true)}
        ${grp(o.ns, om.ns, true)}
      </tr>`;
    }).join('');
    const PG = uShowCounts ? 2 : 1;
    const gHead = (title, sub) => `<th class="gs" colspan="${PG}">${title}${sub?`<span class="gsub">${sub}</span>`:''}</th>`;
    const mhHead = '<span class="mhwrap"><span class="m">Mins</span><span class="sep">|</span><span class="h">Hrs</span></span>';
    const sHead = () => (uShowCounts ? `<th class="gs">#</th><th class="mh">${mhHead}</th>`
                                     : `<th class="gs mh">${mhHead}</th>`);
    const tHead = `<thead>
      <tr class="grp">
        <th class="dimh" rowspan="2">Metric</th>
        <th class="dimh" rowspan="2" style="text-align:center">Slot<span class="gsub">config</span></th>
        ${gHead('Booked','all bookings')}
        <th class="gs" rowspan="2" style="vertical-align:bottom;text-align:right">Resch +<br>Canc</th>
        ${gHead('Gross','completed + no-show')}
        ${gHead('Net','completed')}
        ${gHead('No-show','burned time')}
      </tr>
      <tr class="sub">${sHead()}${sHead()}${sHead()}${sHead()}</tr>
    </thead>`;
    const tG = (c,m,first) => (uShowCounts ? `<td class="${first?'gs':''}">${c.toLocaleString('en-IN')}</td>` : '')
      + `<td class="mh${(!uShowCounts&&first)?' gs':''}">${mhCell(m)}</td>`;
    const tableHtml = `<div class="matrixcard"><table class="util${uShowCounts?' compact':''}">
      ${tHead}
      <tbody>${trs}
      <tr class="tot"><td class="lbl">Total</td><td></td>
        ${tG(tot.bookedC, tot.bookedM, true)}
        <td class="gs">${tot.rcC}</td>
        ${tG(tot.grossC, tot.grossM, true)}
        ${tG(tot.netC, tot.netM, true)}
        ${tG(tot.nsC, tot.nsM, true)}
      </tr>
      </tbody></table></div>`;
    const bookedU = blockH>0 ? (tot.bookedM/60)/blockH : null;
    const grossU  = blockH>0 ? (tot.grossM/60)/blockH : null;
    const netU    = blockH>0 ? (tot.netM/60)/blockH : null;
    const nsByGross = tot.grossM>0 ? tot.nsM/tot.grossM : null;
    const docName = uDoc==='' ? 'All doctors' : U.doctors[+uDoc];
    const statCards = `<div class="statcards" style="grid-template-columns:repeat(5,minmax(0,1fr))">
      <div class="statcard"><div class="l">Total block hours</div><div class="v">${fh(blockH)}h</div></div>
      <div class="statcard"><div class="l">Booked utilization</div><div class="v">${fpu(bookedU)}</div></div>
      <div class="statcard"><div class="l">Gross utilization</div><div class="v">${fpu(grossU)}</div></div>
      <div class="statcard"><div class="l">Net utilization</div><div class="v">${fpu(netU)}</div></div>
      <div class="statcard"><div class="l">No-show % of gross</div><div class="v">${fpu(nsByGross)}</div></div>
    </div>`;
    document.getElementById('content').innerHTML =
      statCards +
      band(`${docName} — ${activeDocs.length} doctor${activeDocs.length===1?'':'s'} with roster in range`, '') + tableHtml +
      `<div class="cfgcard"><h3>How this tab computes</h3><div class="note">
        Every value = count × that DOCTOR's slot config for the row, shown as minutes | hours (configs vary by doctor —
        "varies" means the selection mixes configs; conversion always happens per doctor before summing).
        <b>Gross</b> = completed + no-show. <b>Net</b> = completed. <b>Booked utilization</b> = booked hours ÷ total block hours
        (${fh(blockH)}h in selection); <b>Gross/Net utilization</b> likewise vs block hours; <b>No-show % of gross</b> = no-show
        time ÷ gross time. No-show = booking updated after slot start without completing (incl. late reschedules/cancellations);
        Resch + Canc = released before start (count only — released time returns to the pool). Program: mental_health tag → MH,
        everything else (incl. untagged) → SH. Booking channel = the appointment's mode.</div></div>`;
    const opts = ['<option value="All doctors"></option>']
      .concat(U.doctors.map(n=>n).sort((a,b)=>a.localeCompare(b))
        .map(n=>`<option value="${n}"></option>`)).join('');
    document.getElementById('exec').innerHTML =
      `<b>Doctor:</b> <input id="uDoc" list="uDocList" placeholder="All doctors — type to search"
         value="${uDoc===''?'':U.doctors[+uDoc]}"
         style="font:inherit;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:var(--page);color:var(--ink-1);width:240px">
       <datalist id="uDocList">${opts}</datalist>
       &nbsp; <b>Date:</b> <input type="date" id="uFrom" value="${uFrom}" style="font:inherit;padding:3px 6px;border:1px solid var(--border);border-radius:6px;background:var(--page);color:var(--ink-1)">
       – <input type="date" id="uTo" value="${uTo}" style="font:inherit;padding:3px 6px;border:1px solid var(--border);border-radius:6px;background:var(--page);color:var(--ink-1)">
       <button id="uCounts" style="float:right;font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--border);border-radius:7px;background:var(--track);color:var(--ink-2);cursor:pointer">${uShowCounts?'Hide counts ▾':'Show counts ▸'}</button>`;
    const bind = id => document.getElementById(id).addEventListener('change', e=>{
      if (id==='uFrom') uFrom = e.target.value; else uTo = e.target.value;
      if (uFrom > uTo) { if (id==='uFrom') uTo = uFrom; else uFrom = uTo; }
      renderTabU();
    });
    bind('uFrom'); bind('uTo');
    document.getElementById('uDoc').addEventListener('change', e=>{
      const v = e.target.value.trim();
      if (!v || v.toLowerCase()==='all doctors'){ uDoc=''; renderTabU(); return; }
      let i = U.doctors.findIndex(n=>n.toLowerCase()===v.toLowerCase());
      if (i<0) i = U.doctors.findIndex(n=>n.toLowerCase().includes(v.toLowerCase()));
      if (i>=0){ uDoc=String(i); renderTabU(); }
    });
    document.getElementById('uCounts').addEventListener('click', ()=>{ uShowCounts=!uShowCounts; renderTabU(); });
  }

  function render(){
    document.getElementById('metricToggle').style.display = (tab==='u') ? 'none' : '';
    ({'0':renderTab0,'1':renderTab1,'2':renderTab2,'3':renderTab3,'u':renderTabU})[tab]();
    document.getElementById('foot').innerHTML =
      `Definitions — <b>Offered</b>: total configured slots on the roster (after shrinkage). <b>Total Booked</b> = Completed + No Show + Rescheduled + Cancelled. ` +
      `<b>No Show</b> = booking updated after the slot start without completing (includes late reschedules/cancellations — the slot was burned). ` +
      `<b>Gross Utilization</b> = (Completed + No Show) ÷ Offered. <b>Net Utilization</b> = Completed ÷ Offered. ` +
      `Rescheduled and cancelled here mean released BEFORE the slot start (slot returned to the pool). ` +
      `Hour Level converts each metric via its program’s configured duration. ` +
      `Data: allo_prod roster_slots (corrected dedup) + appointments + consultation_type_configs · ${D.doctor} · ${D.day}. ` +
      `Refresh: <code>python3 fetch_prototype_data.py [provider_id] [day]</code>.`;
  }

  document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{
    tab = b.dataset.t;
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on', x===b));
    render();
  }));
  document.querySelectorAll('#metricToggle button').forEach(b=>b.addEventListener('click',()=>{
    metric = b.dataset.m;
    document.querySelectorAll('#metricToggle button').forEach(x=>x.classList.toggle('on', x===b));
    render();
  }));
  render();
})();
</script>
</body>
</html>
